# 追加到 /usr/local/nginx/nginx.conf 的 server{} 内（80 与 443 各一份）
# 站点根已是 /data/webserver，所以 /majiangapp/ 与 tiles/ 都能被 root 直接命中。

# 麻将 API：/majiangapi/xxx -> 后端 /api/xxx（末尾必须带 /api/）
location /majiangapi/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Server-Addr $server_addr;
    proxy_set_header X-Server-Port $server_port;
    proxy_set_header X-Protocol-Used $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 兼容直接以 /api 访问（本地开发同源约定；共享 nginx 上仅在未被占用时启用）
location /api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 麻将 WebSocket：/majiangws?token=..&code=.. -> 后端 /ws
location /majiangws {
    proxy_pass http://127.0.0.1:8000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /ws {
    proxy_pass http://127.0.0.1:8000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 皮肤图片：长缓存 + immutable（文件名带指纹，删一张只影响那一张）
location /majiangapp/tiles/ {
    root /data/webserver;
    expires 365d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# 音效 SFX：30 天缓存（08 §6；替换资源须改名或加 ?v=）
location /majiangapp/audio/sfx/ {
    root /data/webserver;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}

# 前端 SPA（history 路由回退到 /majiangapp/index.html）
location /majiangapp/ {
    root /data/webserver;
    index index.html;
    try_files $uri $uri/ /majiangapp/index.html;
}
